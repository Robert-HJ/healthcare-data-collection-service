name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.4.10
        env:
          MYSQL_DATABASE: healthcare
          MYSQL_USER: healthcare
          MYSQL_PASSWORD: healthcare
          MYSQL_ROOT_PASSWORD: healthcare-root
          TZ: UTC
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -phealthcare-root --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=20s

    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/healthcare?rewriteBatchedStatements=true
      SPRING_DATASOURCE_USERNAME: healthcare
      SPRING_DATASOURCE_PASSWORD: healthcare
      JWT_SECRET: ci-test-hmac-secret-at-least-32-bytes
      TZ: UTC

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          if-no-files-found: ignore
