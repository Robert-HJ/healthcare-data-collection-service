<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="930" viewBox="0 0 1500 930" role="img" aria-labelledby="title desc">
  <title id="title">Healthcare data collection database ERD</title>
  <desc id="desc">Logical relationships among member, health data collection request, health step data, and daily aggregation tables. The schema intentionally has no physical foreign key constraints.</desc>
  <defs>
    <marker id="relation" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .table-title { font: 700 18px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #ffffff; }
      .field { font: 14px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #334155; }
      .key { font: 700 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #2563eb; }
      .note { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .relation-line { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#relation); }
    </style>
  </defs>

  <rect width="1500" height="930" rx="24" fill="#ffffff"/>
  <text x="44" y="52" class="title">데이터베이스 모델</text>
  <text x="44" y="79" class="note">점선은 애플리케이션에서 관리하는 논리 관계이며, DDL에는 물리 외래키 제약을 두지 않았습니다.</text>

  <path d="M344 385 H400" class="relation-line"/>
  <path d="M344 445 H845 V321 H895" class="relation-line"/>
  <path d="M825 397 H895" class="relation-line"/>
  <path d="M344 505 H845 V708 H895" class="relation-line"/>

  <g transform="translate(44 220)">
    <rect width="300" height="370" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <path d="M14 0 H286 A14 14 0 0 1 300 14 V56 H0 V14 A14 14 0 0 1 14 0" fill="#334155"/>
    <text x="20" y="36" class="table-title">member</text>
    <text x="20" y="88" class="key">PK  id</text>
    <text x="20" y="118" class="field">name</text>
    <text x="20" y="148" class="field">nickname</text>
    <text x="20" y="178" class="field">email</text>
    <text x="20" y="208" class="field">password</text>
    <text x="20" y="238" class="field">record_key</text>
    <text x="20" y="268" class="field">created_at</text>
    <text x="20" y="298" class="field">updated_at</text>
    <line x1="18" y1="318" x2="282" y2="318" stroke="#cbd5e1"/>
    <text x="20" y="344" class="key">UK  email</text>
    <text x="20" y="365" class="key">UK  record_key</text>
  </g>

  <g transform="translate(400 106)">
    <rect width="425" height="582" rx="14" fill="#f8fafc" stroke="#60a5fa" stroke-width="2"/>
    <path d="M14 0 H411 A14 14 0 0 1 425 14 V56 H0 V14 A14 14 0 0 1 14 0" fill="#2563eb"/>
    <text x="20" y="36" class="table-title">health_data_collection_request</text>
    <text x="20" y="88" class="key">PK  id</text>
    <text x="20" y="118" class="field">member_id</text>
    <text x="20" y="148" class="field">source</text>
    <text x="20" y="178" class="field">data_type</text>
    <text x="20" y="208" class="field">payload  JSON</text>
    <text x="20" y="238" class="field">status</text>
    <text x="20" y="268" class="field">retry_count</text>
    <text x="20" y="298" class="field">error_message</text>
    <text x="20" y="328" class="field">created_at</text>
    <text x="20" y="358" class="field">updated_at</text>
    <line x1="18" y1="382" x2="407" y2="382" stroke="#cbd5e1"/>
    <text x="20" y="411" class="key">IDX status, updated_at</text>
    <text x="20" y="441" class="key">IDX member_id, source,</text>
    <text x="53" y="466" class="key">data_type, id</text>
    <line x1="18" y1="488" x2="407" y2="488" stroke="#cbd5e1"/>
    <text x="20" y="518" class="note">원본 입력 보관</text>
    <text x="20" y="545" class="note">비동기 작업 상태·재시도 관리</text>
  </g>

  <g transform="translate(895 96)">
    <rect width="555" height="450" rx="14" fill="#f8fafc" stroke="#4ade80" stroke-width="2"/>
    <path d="M14 0 H541 A14 14 0 0 1 555 14 V56 H0 V14 A14 14 0 0 1 14 0" fill="#16a34a"/>
    <text x="20" y="36" class="table-title">health_step_data</text>
    <text x="20" y="88" class="key">PK  id</text>
    <text x="20" y="118" class="field">member_id</text>
    <text x="20" y="148" class="field">collection_request_id</text>
    <text x="20" y="178" class="field">source</text>
    <text x="20" y="208" class="field">started_at / ended_at  UTC</text>
    <text x="20" y="238" class="field">steps / distance / calories  DECIMAL</text>
    <text x="20" y="268" class="field">created_at / updated_at</text>
    <line x1="18" y1="294" x2="537" y2="294" stroke="#cbd5e1"/>
    <text x="20" y="324" class="key">UK  member_id, source, started_at, ended_at</text>
    <text x="20" y="354" class="key">IDX collection_request_id</text>
    <line x1="18" y1="378" x2="537" y2="378" stroke="#cbd5e1"/>
    <text x="20" y="408" class="note">Source별 입력을 정규화한 걸음 활동 구간</text>
  </g>

  <g transform="translate(895 602)">
    <rect width="555" height="282" rx="14" fill="#f8fafc" stroke="#fb923c" stroke-width="2"/>
    <path d="M14 0 H541 A14 14 0 0 1 555 14 V56 H0 V14 A14 14 0 0 1 14 0" fill="#ea580c"/>
    <text x="20" y="36" class="table-title">health_step_daily_aggregation</text>
    <text x="20" y="88" class="key">PK  id</text>
    <text x="20" y="118" class="field">member_id / timezone / source</text>
    <text x="20" y="148" class="field">aggregate_date</text>
    <text x="20" y="178" class="field">steps / distance / calories  DECIMAL</text>
    <line x1="18" y1="200" x2="537" y2="200" stroke="#cbd5e1"/>
    <text x="20" y="228" class="key">UK  member_id, timezone, source, aggregate_date</text>
    <text x="20" y="256" class="key">IDX member_id, timezone, aggregate_date</text>
  </g>
</svg>
