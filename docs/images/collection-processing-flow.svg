<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="920" viewBox="0 0 1680 920" role="img" aria-labelledby="title desc">
  <title id="title">Healthcare data collection processing flow</title>
  <desc id="desc">A synchronous request stores a validated payload and returns 202. An after-commit signal and a polling scheduler start workers that claim requests, normalize data, upsert step data, recalculate daily aggregates, and complete the request.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .lane-title { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .box-title { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .box-text { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .label { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .arrow { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .arrow-dashed { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1680" height="920" rx="24" fill="#ffffff"/>
  <text x="48" y="54" class="title">건강 데이터 수집 처리 흐름</text>

  <rect x="32" y="82" width="1616" height="222" rx="18" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="56" y="115" class="lane-title">HTTP 요청 · 접수 트랜잭션</text>

  <rect x="68" y="155" width="190" height="92" rx="13" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  <text x="163" y="190" text-anchor="middle" class="box-title">Client</text>
  <text x="163" y="218" text-anchor="middle" class="box-text">JWT + 원본 JSON</text>

  <rect x="325" y="142" width="245" height="118" rx="13" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  <text x="447" y="178" text-anchor="middle" class="box-title">인증·소유권 확인</text>
  <text x="447" y="207" text-anchor="middle" class="box-text">JWT의 memberId·recordKey</text>
  <text x="447" y="232" text-anchor="middle" class="box-text">payload recordKey 비교</text>

  <rect x="637" y="142" width="245" height="118" rx="13" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  <text x="759" y="178" text-anchor="middle" class="box-title">입력 계약 검증</text>
  <text x="759" y="207" text-anchor="middle" class="box-text">Source + Data Type</text>
  <text x="759" y="232" text-anchor="middle" class="box-text">시간·수치·단위 전체 검증</text>

  <rect x="949" y="142" width="268" height="118" rx="13" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  <text x="1083" y="178" text-anchor="middle" class="box-title">원본 요청 저장</text>
  <text x="1083" y="207" text-anchor="middle" class="box-text">JSON payload + PENDING</text>
  <text x="1083" y="232" text-anchor="middle" class="box-text">DB 작업 큐의 내구성 확보</text>

  <rect x="1284" y="155" width="200" height="92" rx="13" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="1384" y="190" text-anchor="middle" class="box-title">202 Accepted</text>
  <text x="1384" y="218" text-anchor="middle" class="box-text">requestId + PENDING</text>

  <path d="M258 201 H325" class="arrow"/>
  <path d="M570 201 H637" class="arrow"/>
  <path d="M882 201 H949" class="arrow"/>
  <path d="M1217 201 H1284" class="arrow"/>
  <path d="M1083 260 V318 H177 V405" class="arrow-dashed"/>
  <text x="625" y="314" text-anchor="middle" class="label">접수 트랜잭션 커밋 성공 후</text>

  <rect x="32" y="330" width="1616" height="408" rx="18" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="56" y="364" class="lane-title">비동기 수집 · 처리 트랜잭션</text>

  <rect x="68" y="405" width="218" height="106" rx="13" fill="#ffffff" stroke="#4ade80" stroke-width="2"/>
  <text x="177" y="441" text-anchor="middle" class="box-title">AFTER_COMMIT</text>
  <text x="177" y="470" text-anchor="middle" class="box-text">처리 지연을 줄이는</text>
  <text x="177" y="494" text-anchor="middle" class="box-text">실행 요청</text>

  <rect x="350" y="405" width="235" height="106" rx="13" fill="#ffffff" stroke="#4ade80" stroke-width="2"/>
  <text x="467" y="441" text-anchor="middle" class="box-title">전용 Worker Pool</text>
  <text x="467" y="470" text-anchor="middle" class="box-text">동시 실행 4 · 대기 큐 0</text>
  <text x="467" y="494" text-anchor="middle" class="box-text">남은 작업이 없으면 종료</text>

  <rect x="649" y="392" width="266" height="132" rx="13" fill="#ffffff" stroke="#4ade80" stroke-width="2"/>
  <text x="782" y="428" text-anchor="middle" class="box-title">요청 한 건 선점</text>
  <text x="782" y="457" text-anchor="middle" class="box-text">FOR UPDATE SKIP LOCKED</text>
  <text x="782" y="481" text-anchor="middle" class="box-text">그룹별 가장 오래된 요청</text>
  <text x="782" y="505" text-anchor="middle" class="box-text">PROCESSING · 짧은 트랜잭션</text>

  <rect x="980" y="392" width="260" height="132" rx="13" fill="#ffffff" stroke="#4ade80" stroke-width="2"/>
  <text x="1110" y="428" text-anchor="middle" class="box-title">처리기 선택·정규화</text>
  <text x="1110" y="457" text-anchor="middle" class="box-text">Source + Data Type</text>
  <text x="1110" y="481" text-anchor="middle" class="box-text">시각 UTC · 수치 BigDecimal</text>
  <text x="1110" y="505" text-anchor="middle" class="box-text">동일 구간 요청 내 중복 정리</text>

  <rect x="1305" y="392" width="275" height="132" rx="13" fill="#ffffff" stroke="#4ade80" stroke-width="2"/>
  <text x="1442" y="428" text-anchor="middle" class="box-title">활동 데이터 upsert</text>
  <text x="1442" y="457" text-anchor="middle" class="box-text">JDBC batch</text>
  <text x="1442" y="481" text-anchor="middle" class="box-text">동일 from-to 갱신</text>
  <text x="1442" y="505" text-anchor="middle" class="box-text">다른 구간은 신규 저장</text>

  <path d="M286 458 H350" class="arrow"/>
  <path d="M585 458 H649" class="arrow"/>
  <path d="M915 458 H980" class="arrow"/>
  <path d="M1240 458 H1305" class="arrow"/>

  <rect x="942" y="578" width="288" height="112" rx="13" fill="#ffffff" stroke="#22c55e" stroke-width="2"/>
  <text x="1086" y="614" text-anchor="middle" class="box-title">일별 집계 전량 재계산</text>
  <text x="1086" y="643" text-anchor="middle" class="box-text">영향 날짜 · Asia/Seoul + UTC</text>
  <text x="1086" y="668" text-anchor="middle" class="box-text">일별 집계 batch upsert</text>

  <rect x="1305" y="578" width="275" height="112" rx="13" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1442" y="614" text-anchor="middle" class="box-title">COMPLETED</text>
  <text x="1442" y="643" text-anchor="middle" class="box-text">활동·집계·상태를</text>
  <text x="1442" y="668" text-anchor="middle" class="box-text">한 번에 커밋</text>

  <path d="M1442 524 V548 H1086 V578" class="arrow"/>
  <path d="M1230 634 H1305" class="arrow"/>
  <path d="M1442 690 V711 H782 V524" class="arrow-dashed"/>
  <text x="1110" y="727" text-anchor="middle" class="label">다음 요청 계속 선점</text>

  <rect x="32" y="764" width="1616" height="124" rx="18" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="56" y="798" class="lane-title">복구 경로</text>

  <rect x="187" y="815" width="260" height="48" rx="12" fill="#ffffff" stroke="#fb923c" stroke-width="2"/>
  <text x="317" y="845" text-anchor="middle" class="box-title">1분 폴링 스케줄러</text>

  <rect x="627" y="805" width="360" height="68" rx="12" fill="#ffffff" stroke="#fb923c" stroke-width="2"/>
  <text x="807" y="833" text-anchor="middle" class="box-title">PENDING · 재시도 가능한 FAILED</text>
  <text x="807" y="857" text-anchor="middle" class="box-text">오래된 PROCESSING 요청 복구</text>

  <rect x="1167" y="805" width="330" height="68" rx="12" fill="#ffffff" stroke="#fb923c" stroke-width="2"/>
  <text x="1332" y="833" text-anchor="middle" class="box-title">실패 상태 별도 기록</text>
  <text x="1332" y="857" text-anchor="middle" class="box-text">FAILED + retryCount + errorMessage</text>

  <path d="M447 839 H627" class="arrow"/>
  <path d="M807 805 V745 H467 V511" class="arrow-dashed"/>
  <path d="M1110 524 H1595 V744 H1332 V805" class="arrow-dashed"/>
  <text x="1515" y="729" text-anchor="middle" class="label">처리 예외</text>
  <path d="M1167 839 H987" class="arrow-dashed"/>
  <text x="1077" y="829" text-anchor="middle" class="label">retryCount &lt; 5</text>
</svg>
