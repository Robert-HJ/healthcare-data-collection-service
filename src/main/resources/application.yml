spring:
  application:
    name: healthcare-data-collection-service

  profiles:
    default: local

  jpa:
    open-in-view: false
    properties:
      hibernate.type.json_format_mapper: jackson3 # 스웨거 사용으로 인해 jackson2가 같이 쓰이고 있어서 설정으로 명시

  task:
    execution:
      mode: force
      thread-name-prefix: common-async-
      pool:
        core-size: 4
        max-size: 8
        queue-capacity: 100

healthcare:
  collection:
    worker:
      concurrency: 4
      max-retry-count: 5
      stale-processing-timeout: PT5M
      polling-interval: PT1M
    steps:
      aggregation:
        time-zones:
          - Asia/Seoul
          - UTC
        default-time-zone: Asia/Seoul
